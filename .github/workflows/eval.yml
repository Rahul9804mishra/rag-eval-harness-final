name: RAG Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Evaluation (50 Qs x 4 Methods)
        run: python eval/run_eval.py

      - name: Calculate Accuracy & Check Threshold
        run: python eval/check_threshold.py

      - name: Upload results.json as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json
